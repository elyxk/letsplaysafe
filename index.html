<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>גינה בטוחה 🐦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
/* ===== TOKENS ===== */
:root {
  --coral: #FF6B35;
  --coral-dark: #E05520;
  --coral-light: #FFF4EE;
  --green: #4ECBA0;
  --green-dark: #2A9A7A;
  --blue: #1BBCB3;
  --sky: #EAF8F6;
  --orange: #F5A623;
  --white: #ffffff;
  --bg: #F7F9FB;
  --text: #1C2D5E;
  --text2: #7B8BAA;
  --text3: #BCC5D6;
  --border: rgba(28,45,94,0.07);
  --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 28px;
  --sh-sm: 0 1px 4px rgba(28,45,94,0.06), 0 2px 8px rgba(28,45,94,0.05);
  --sh-md: 0 2px 12px rgba(28,45,94,0.08), 0 6px 24px rgba(28,45,94,0.07);
  --sh-lg: 0 4px 24px rgba(28,45,94,0.10), 0 12px 48px rgba(28,45,94,0.12);
  --topbar-h: 88px;
  --filter-h: 0px;
  --header-green: transparent;
  --sidebar-w: 360px;
  --font: 'Heebo', sans-serif;
  --glass-bg: rgba(255,255,255,0.95);
  --glass-bg-white: rgba(255,255,255,0.97);
  --glass-blur: blur(24px) saturate(180%);
  --spring: cubic-bezier(0.32, 0.72, 0, 1);
}

/* ===== RESET ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:var(--font);cursor:pointer;border:none;background:none}
input,textarea{font-family:var(--font)}
a{text-decoration:none;color:inherit}
.tb-pill,.fp,.lcard,.btn-walk-inline,.btn-add-rev,#emg-btn,.srow,.vt-btn{transition-timing-function:var(--spring)}

/* ===== LAYOUT ===== */
#app{display:flex;height:100%;position:relative;overflow:hidden}

/* Map area — full screen */
#map-area{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%}

/* Bottom sheet hidden — not used in full-screen mode */
#bottom-sheet{display:none}

/* Mobile topbar — clean white with teal accent */
#topbar{
  position:fixed;top:0;right:0;left:0;
  background:white;
  border-bottom:2px solid var(--sky);
  display:flex;flex-direction:column;
  padding:10px 16px 8px;gap:6px;z-index:500
}
/* Row 1: name + lang + search */
.tb-row1{display:flex;align-items:center;gap:8px;min-height:34px}
/* Row 2: filter pills */
.tb-row2{display:flex;align-items:center;gap:8px}
.tb-pills{display:flex;gap:8px;flex-shrink:0}
.tb-pill{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;border:2px solid transparent;
  background:white;box-shadow:var(--sh-sm);
  transition:transform .15s,box-shadow .15s
}
.tb-pill.red{border-color:var(--coral);background:var(--coral-light)}
.tb-pill.green{border-color:var(--green);background:rgba(78,203,160,0.12)}
.tb-pill.active-filter{transform:scale(1.10);box-shadow:var(--sh-md)}
.tb-center{flex:1;min-width:0}
.tb-name{font-size:18px;font-weight:800;color:var(--text);line-height:1;letter-spacing:-0.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-tagline{display:none}
.tb-menu{color:var(--blue);font-size:20px;padding:4px;flex-shrink:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center}

/* Filter bar hidden on mobile (replaced by pills in header) */
#filterbar{display:none}

/* List header */
#list-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;border-bottom:1px solid var(--border);
  background:white;position:sticky;top:0;z-index:10
}
#list-title{font-size:16px;font-weight:800;color:var(--text)}
#list-count{font-size:13px;font-weight:600;color:var(--text2)}

/* Location prompt card inside list */
.loc-prompt{
  margin:12px 12px 8px;background:var(--sky);
  border-radius:var(--r-md);padding:16px;
  border:1px solid rgba(27,188,179,.20)
}
.lp-title{font-size:14px;font-weight:800;color:var(--blue);margin-bottom:4px;text-align:right}
.lp-sub{font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.5;text-align:right}
.lp-btn{
  width:100%;background:var(--blue);color:white;
  font-size:14px;font-weight:700;padding:12px;
  border-radius:var(--r-sm);min-height:44px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 2px 8px rgba(27,188,179,0.30)
}

/* ===== LANGUAGE SWITCHER ===== */
#lang-sw{display:flex;gap:2px}
.tb-lang-sw{
  display:flex;gap:2px;flex-shrink:0;
  background:rgba(116,116,128,0.12);border-radius:10px;padding:2px
}
.tb-lang-sw .lang-btn{
  color:var(--text2);min-width:0;min-height:0;
  padding:4px 8px;font-size:11px;font-weight:700;
  border-radius:8px;transition:all .15s
}
.tb-lang-sw .lang-btn.active{background:var(--blue);color:white;box-shadow:0 1px 4px rgba(27,188,179,0.30)}
.lang-btn{
  padding:8px 10px;font-size:12px;font-weight:700;color:var(--text2);
  border-radius:8px;transition:all .15s;min-height:44px;min-width:44px
}
.lang-btn.active{background:var(--blue);color:white}

/* ===== FILTER PILLS ===== */
.fp{
  padding:7px 16px;border-radius:20px;font-size:13px;font-weight:700;
  color:var(--text2);background:rgba(28,45,94,0.07);border:none;
  transition:all .15s;white-space:nowrap;min-height:32px;
  display:flex;align-items:center;gap:4px;cursor:pointer
}
.fp.active{background:var(--blue);color:white;box-shadow:0 2px 8px rgba(27,188,179,0.30)}

/* ===== SIDEBAR (desktop) ===== */
#sidebar{
  display:none;width:var(--sidebar-w);height:100%;
  background:white;
  border-left:2px solid var(--sky);
  flex-direction:column;z-index:100;flex-shrink:0
}
.sb-topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 20px 14px;border-bottom:2px solid var(--sky);flex-shrink:0
}
.sb-logo{font-size:22px;font-weight:800;letter-spacing:-0.5px}
.sb-sub{font-size:11px;font-weight:600;color:var(--text2);margin-top:1px}
.sb-search-wrap{padding:10px 14px 6px;flex-shrink:0}
.sb-search{
  width:100%;padding:10px 16px;border-radius:var(--r-sm);
  border:1.5px solid var(--sky);background:var(--bg);
  font-size:15px;font-weight:500;color:var(--text);outline:none;
  min-height:36px;transition:border-color .15s,background .15s;font-family:var(--font)
}
.sb-search:focus{border-color:var(--blue);background:white}
.sb-filterbar{
  display:flex;gap:6px;padding:4px 14px 10px;
  overflow-x:auto;flex-shrink:0;scrollbar-width:none
}
.sb-filterbar::-webkit-scrollbar{display:none}
.sb-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sb-gps-card{
  margin:10px 14px 14px;background:var(--sky);
  border-radius:var(--r-md);padding:16px;text-align:center;
  border:1px solid rgba(27,188,179,.20)
}
.sb-gps-card p{font-size:13px;color:var(--text2);margin-bottom:10px;line-height:1.5}
.sb-gps-btn{
  width:100%;background:var(--blue);color:white;
  font-size:13px;font-weight:700;padding:11px;
  border-radius:var(--r-sm);min-height:42px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 2px 8px rgba(27,188,179,0.30)
}
.sb-emergency{padding:10px 14px 14px;flex-shrink:0;border-top:2px solid var(--sky)}
.sb-emg-btn{
  width:100%;background:var(--coral);color:white;
  font-size:14px;font-weight:800;padding:13px;
  border-radius:var(--r-md);min-height:48px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  animation:emgPulse 2.5s ease-in-out infinite;transition:background .15s
}
.sb-emg-btn.dimmed{background:rgba(28,45,94,0.10);color:var(--text2);animation:none}

/* ===== MAP FLOATING CONTROLS ===== */
/* GPS pill */
#gps-pill{
  position:absolute;
  top:calc(var(--topbar-h) + var(--filter-h) + 14px);
  left:50%;transform:translateX(-50%);
  background:var(--blue);color:white;font-size:14px;font-weight:700;
  padding:10px 22px;border-radius:24px;box-shadow:0 4px 16px rgba(27,188,179,0.35);
  z-index:400;white-space:nowrap;border:none;
  transition:all .2s;min-height:44px;display:flex;align-items:center;gap:6px
}
#gps-pill.hidden{display:none}

/* View toggle */
#view-toggle{
  position:absolute;
  top:calc(var(--topbar-h) + var(--filter-h) + 14px);right:14px;
  background:white;border-radius:var(--r-sm);box-shadow:var(--sh-md);
  z-index:400;display:flex;overflow:hidden;border:1.5px solid var(--border)
}
.vt-btn{
  padding:10px 14px;font-size:16px;transition:background .15s;
  min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center
}
.vt-btn.active{background:var(--text)}
.vt-btn.active span{filter:invert(1)}

/* Emergency bar — fixed floating */
#emg-bar{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:400;width:calc(100% - 32px);max-width:420px;
}
#emg-btn{
  width:100%;background:var(--coral);color:white;
  font-size:17px;font-weight:700;padding:16px 24px;
  border-radius:var(--r-xl);box-shadow:0 4px 16px rgba(255,107,53,0.40),0 1px 3px rgba(255,107,53,0.30);
  display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-0.2px;
  min-height:56px;transition:all .2s;animation:emgPulse 2.5s ease-in-out infinite
}
#emg-btn.dimmed{background:rgba(28,45,94,0.10);color:var(--text2);box-shadow:none;animation:none}

@keyframes emgPulse{
  0%,100%{box-shadow:0 4px 16px rgba(255,107,53,0.40)}
  50%{box-shadow:0 4px 28px rgba(255,107,53,0.65),0 0 0 8px rgba(255,107,53,0.10)}
}

/* ===== MUTED OVERLAY + LOCATION CARD ===== */
#muted-overlay{
  position:absolute;inset:0;
  background:rgba(255,255,255,.35);
  backdrop-filter:blur(2px) saturate(30%);
  -webkit-backdrop-filter:blur(2px) saturate(30%);
  z-index:350;transition:opacity .5s;pointer-events:none
}
#muted-overlay.hidden{opacity:0;pointer-events:none}

/* Location pill: bottom-anchored pill to activate geolocation */
#loc-card{
  position:absolute;
  bottom:100px;left:50%;
  transform:translateX(-50%);
  z-index:360;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  border-radius:var(--r-xl);box-shadow:var(--sh-lg),0 0 0 0.5px rgba(0,0,0,0.06);
  padding:24px 20px 20px;max-width:320px;width:calc(100% - 40px);
  text-align:center;border:none;
  transition:opacity .4s,transform .4s;
  pointer-events:all;
  animation:lcEntry 0.4s cubic-bezier(0.32,0.72,0,1) 0.25s both;
}
@keyframes lcEntry{
  from{opacity:0;transform:translateX(-50%) translateY(16px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}
#loc-card.hidden{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px);animation:none}
@media(min-width:768px){#loc-card{display:none}}
/* Welcome card mascot */
.lc-mascot{display:flex;align-items:flex-end;justify-content:center;gap:0;margin-bottom:4px;position:relative}
.lc-bird{width:90px;height:90px;flex-shrink:0}
.lc-scene-icons{display:flex;flex-direction:column;gap:8px;padding-bottom:6px;margin-right:-8px}
.lc-scene-icon{
  width:44px;height:44px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 8px rgba(28,45,94,0.12)
}
.lc-scene-icon.green{background:rgba(78,203,160,0.15)}
.lc-scene-icon.coral{background:rgba(255,107,53,0.10)}
/* Hide old icon circles */
.lc-icons,.lc-icon-circle,.lc-icon{display:none}
.lc-city{font-size:22px;font-weight:800;letter-spacing:-0.5px;line-height:1.2;margin-bottom:8px;color:var(--text)}
.lc-sub{font-size:14px;color:var(--text2);margin-bottom:24px;line-height:1.6}
.lc-actions{display:flex;gap:8px;flex-direction:column}
#card-gps-btn{
  background:var(--blue);color:white;font-size:17px;font-weight:700;
  padding:16px;border-radius:16px;min-height:56px;width:100%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(27,188,179,0.35);
  transition:transform 0.12s,opacity 0.12s
}
#card-gps-btn:active{transform:scale(0.98);opacity:0.9}
#card-srch-btn{
  background:none;color:var(--text);font-size:15px;font-weight:600;
  padding:10px;min-height:48px;width:100%;
  display:flex;align-items:center;justify-content:center;
  border:none;transition:opacity 0.12s;opacity:0.65
}
#card-srch-btn:active{opacity:0.4}

/* ===== SEARCH BAR ===== */
#srch-wrap{
  position:absolute;
  top:calc(var(--topbar-h) + 8px);
  right:60px;left:60px;z-index:400;display:none
}
#srch-wrap.show{display:block}
#srch-input{
  width:100%;padding:12px 44px 12px 16px;border-radius:var(--r-md);
  border:none;background:rgba(255,255,255,0.96);font-size:15px;font-weight:500;
  color:var(--text);box-shadow:var(--sh-md),0 0 0 0.5px rgba(0,0,0,0.06);outline:none;min-height:44px;
  transition:box-shadow .2s;font-family:var(--font)
}
#srch-input:focus{box-shadow:var(--sh-md),0 0 0 2px rgba(0,122,255,0.35)}
#srch-input.alert{animation:saPulse .6s ease-in-out 3}
@keyframes saPulse{0%,100%{box-shadow:var(--sh-md),0 0 0 0.5px rgba(0,0,0,0.06)}50%{box-shadow:var(--sh-md),0 0 0 3px rgba(0,122,255,0.25)}}
#srch-close{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  font-size:18px;color:var(--text2);width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;border-radius:50%
}
.srch-alert{
  background:var(--sky);color:var(--blue);font-size:12px;font-weight:600;
  padding:8px 12px;border-radius:var(--r-sm);margin-bottom:6px;display:none
}
.srch-alert.show{display:block}
#srch-results,#sb-srch-results{
  margin-top:6px;background:white;border-radius:var(--r-md);
  box-shadow:var(--sh-md);overflow:hidden;border:1px solid var(--border);
  max-height:220px;overflow-y:auto
}
.srch-item{
  padding:13px 16px;font-size:15px;font-weight:500;cursor:pointer;
  border-bottom:1px solid rgba(0,0,0,0.06);transition:background .1s
}
.srch-item:last-child{border-bottom:none}
.srch-item:hover{background:rgba(0,0,0,0.04)}
.srch-empty,.srch-loading{color:var(--text2);font-style:italic;cursor:default;pointer-events:none}

/* ===== LOADING ===== */
#loading-overlay{
  position:fixed;inset:0;background:rgba(255,255,255,0.97);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;z-index:900;transition:opacity .4s;
}
#loading-overlay.show{display:flex}
#loading-overlay.hidden{opacity:0;pointer-events:none}
.spinner{width:32px;height:32px;border:3px solid rgba(27,188,179,0.20);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-size:14px;font-weight:700;color:var(--text2)}
@keyframes loadBird{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}

/* ===== FAKE MAP PLACEHOLDER ===== */
/* Shown instead of Leaflet tiles until location is known */
#map-placeholder{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,#D6F0F8 0%,#EAF8F6 55%,#C8EDDB 100%);
  overflow:hidden;
}
/* Sky clouds */
#map-placeholder::before{
  content:'';position:absolute;
  top:8%;left:0;right:0;height:60px;
  background:
    radial-gradient(ellipse 70px 28px at 15% 50%,rgba(255,255,255,.85) 60%,transparent 100%),
    radial-gradient(ellipse 45px 20px at 22% 30%,rgba(255,255,255,.70) 60%,transparent 100%),
    radial-gradient(ellipse 55px 22px at 28% 65%,rgba(255,255,255,.60) 60%,transparent 100%),
    radial-gradient(ellipse 80px 30px at 62% 50%,rgba(255,255,255,.85) 60%,transparent 100%),
    radial-gradient(ellipse 50px 22px at 70% 25%,rgba(255,255,255,.70) 60%,transparent 100%),
    radial-gradient(ellipse 60px 24px at 78% 70%,rgba(255,255,255,.65) 60%,transparent 100%);
}
/* Green rolling hill at bottom */
#map-placeholder::after{
  content:'';position:absolute;
  bottom:-20px;left:-5%;right:-5%;height:42%;
  background:#5CC85C;
  border-radius:55% 55% 0 0 / 35% 35% 0 0;
  opacity:.55;
}
/* Fake blurred pins scattered on placeholder */
.fp-pin{
  position:absolute;
  display:flex;align-items:center;justify-content:center;
  animation:fpFloat 3s ease-in-out infinite;
  opacity:.92;
  filter:drop-shadow(0 3px 8px rgba(28,45,94,.20));
}
/* Playground pin: rounded square tile */
.fp-pin.pg{
  width:38px;height:38px;border-radius:13px;
  background:#4ECBA0;border:2.5px solid white;
}
/* Shelter pin: circle with tail (like SH_ICON) */
.fp-pin.sh{
  width:38px;height:46px;flex-direction:column;
  align-items:center;justify-content:flex-start;padding-top:3px;
}
.fp-pin.sh::after{
  content:'';display:block;width:0;height:0;
  border-left:7px solid transparent;border-right:7px solid transparent;
  border-top:9px solid #FF6B35;margin-top:-1px;
}
.fp-pin-circle{
  width:38px;height:38px;border-radius:50%;
  background:#FF6B35;border:2.5px solid white;
  display:flex;align-items:center;justify-content:center;
}
@keyframes fpFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ===== USER DOT ===== */
.udot-wrap{position:relative;width:22px;height:22px}
.udot{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:14px;height:14px;background:var(--blue);
  border:3px solid white;border-radius:50%;box-shadow:0 2px 6px rgba(27,188,179,.5);z-index:2
}
.udot-ring{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:22px;height:22px;background:rgba(27,188,179,.2);border-radius:50%;
  animation:dotPulse 2s ease-out infinite
}
@keyframes dotPulse{0%{transform:translate(-50%,-50%) scale(1);opacity:.8}100%{transform:translate(-50%,-50%) scale(2.5);opacity:0}}

/* ===== BOTTOM DRAWER ===== */
#drw-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:600;
  opacity:0;pointer-events:none;transition:opacity .3s
}
#drw-bg.show{opacity:1;pointer-events:all}
#drawer{
  position:fixed;bottom:0;right:0;left:0;
  background:white;
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:0 -2px 0 var(--sky),0 -8px 40px rgba(28,45,94,.10);
  z-index:700;max-height:85vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1)
}
#drawer.open{transform:translateY(0)}
.drw-handle{width:40px;height:4px;background:var(--text3);border-radius:2px;margin:12px auto 0}
.drw-hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 20px 8px;gap:12px}
.drw-icon-title{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.drw-pin{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.drw-pin.green{background:rgba(78,203,160,0.15)}.drw-pin.coral{background:rgba(255,107,53,0.12)}
.drw-title{font-size:18px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.4px;color:var(--text)}
.drw-addr{font-size:13px;color:var(--text2);margin-top:3px;line-height:1.4;font-weight:500}
.drw-notes{font-size:12px;font-style:italic;color:var(--text2);margin-top:2px}
#drw-close{width:32px;height:32px;background:var(--sky);border-radius:50%;font-size:14px;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.drw-body{padding:0 20px 32px}
.drw-action-row{display:flex;align-items:center;gap:10px;padding:10px 0 14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.drw-dist-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;background:rgba(255,107,53,0.10);flex-shrink:0}
#drawer.pg .drw-dist-pill{background:rgba(78,203,160,0.12)}
.drw-dist-num{font-size:18px;font-weight:800;color:var(--coral);line-height:1}
#drawer.pg .drw-dist-num{color:var(--green)}
.drw-dist-lbl{font-size:12px;font-weight:600;color:var(--text2)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;line-height:1}
.bg-grey{background:rgba(28,45,94,0.07);color:var(--text)}
.bg-coral{background:rgba(255,107,53,0.10);color:var(--coral-dark)}
.bg-blue{background:rgba(27,188,179,0.10);color:var(--green-dark)}
.sec-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.srow{
  display:flex;align-items:center;padding:12px 0;gap:10px;
  border-bottom:1px solid var(--border);cursor:pointer;min-height:56px;
  transition:background .1s;border-radius:var(--r-sm)
}
.srow:last-child{border-bottom:none}
.srow:hover,.srow:active{background:var(--sky)}
.srow-icon{width:32px;height:32px;background:rgba(255,107,53,0.10);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.srow-info{flex:1;min-width:0}
.srow-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow-meta{font-size:12px;color:var(--text2);margin-top:1px}
.srow-dist{font-size:15px;font-weight:800;color:var(--coral);flex-shrink:0}
.btn-walk-inline{
  flex:1;background:var(--green);color:white;font-size:15px;font-weight:700;
  padding:12px 14px;border-radius:var(--r-md);min-height:46px;
  display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:-0.1px;
  transition:background .15s,transform .1s;text-decoration:none;
  box-shadow:0 2px 8px rgba(78,203,160,0.35)
}
.btn-walk-inline:active{transform:scale(0.98)}
#drawer.sh .btn-walk-inline{background:var(--coral);box-shadow:0 2px 8px rgba(255,107,53,0.35)}
/* Fallback full-width when no GPS (no dist pill) */
.drw-action-row.no-dist .btn-walk-inline{width:100%}
.drw-div{height:1px;background:var(--border);margin:18px 0 14px}

/* ===== REVIEWS ===== */
.rev-summary{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.rev-avg{font-size:24px;font-weight:800;letter-spacing:-0.5px;color:var(--orange)}
.rev-stars{font-size:16px;letter-spacing:1px}
.rev-count{font-size:13px;font-weight:600;color:var(--text2)}
.rev-card{background:var(--bg);border-radius:var(--r-md);padding:12px;margin-bottom:8px;border:1px solid var(--border)}
.rev-chdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.rev-cname{font-size:13px;font-weight:700}
.rev-ctime{font-size:11px;color:var(--text2)}
.rev-cstars{font-size:13px;margin-bottom:4px}
.rev-ctext{font-size:13px;line-height:1.5}
.rev-cphoto{margin-top:8px}
.rev-cphoto img{width:80px;height:60px;object-fit:cover;border-radius:8px}
.btn-add-rev{
  width:100%;background:transparent;color:var(--blue);font-size:15px;font-weight:700;
  padding:10px 16px;border-radius:var(--r-md);min-height:44px;
  border:2px solid rgba(27,188,179,0.30);
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:8px;transition:border-color .15s,background .15s,color .15s
}
.btn-add-rev:hover{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.rev-loading,.rev-empty{font-size:13px;color:var(--text2);padding:8px 0}
.rev-empty{font-style:italic}
.rev-err{font-size:12px;color:var(--text3);padding:8px 0}

/* ===== REVIEW MODAL ===== */
#rev-modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900;
  display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s
}
#rev-modal-bg.show{opacity:1;pointer-events:all}
#rev-modal{
  background:white;
  border-radius:var(--r-xl) var(--r-xl) 0 0;border-top:2px solid var(--sky);
  width:100%;padding:20px 20px 48px;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:90vh;overflow-y:auto
}
#rev-modal-bg.show #rev-modal{transform:translateY(0)}
.mod-title{font-size:18px;font-weight:800;margin-bottom:20px;text-align:center;letter-spacing:-0.4px;color:var(--text)}
.mod-lbl{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:6px;margin-top:14px}
.star-pick{display:flex;gap:6px;justify-content:center;margin:6px 0 12px}
.star-btn{font-size:32px;line-height:1;transition:transform .1s;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.star-btn.sel{transform:scale(1.2)}
.mod-input{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);
  border-radius:var(--r-sm);font-size:15px;color:var(--text);
  background:var(--bg);outline:none;transition:border-color .15s,background .15s;font-family:var(--font)
}
.mod-input:focus{border-color:var(--blue);background:white}
textarea.mod-input{resize:vertical;min-height:80px}
.btn-photo{
  width:100%;background:var(--bg);color:var(--text);font-size:14px;font-weight:600;
  padding:12px;border-radius:var(--r-sm);border:2px dashed var(--text3);
  display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;margin-top:6px
}
.photo-prev{margin-top:10px;display:none}
.photo-prev img{width:80px;height:60px;object-fit:cover;border-radius:10px}
.photo-prev.show{display:block}
.btn-submit{
  width:100%;background:var(--blue);color:white;font-size:17px;font-weight:700;
  padding:16px;border-radius:var(--r-xl);min-height:54px;margin-top:20px;transition:background .15s,transform .1s;
  box-shadow:0 4px 16px rgba(27,188,179,0.35)
}
.btn-submit:disabled{background:rgba(28,45,94,0.10);color:var(--text3);cursor:not-allowed;box-shadow:none}
.mod-close-row{display:flex;justify-content:flex-start;margin-bottom:4px}
.mod-close{font-size:24px;color:var(--text2);width:40px;height:40px;display:flex;align-items:center;justify-content:center}

/* ===== EMERGENCY OVERLAY ===== */
#emg-overlay{
  position:fixed;inset:0;
  background:linear-gradient(160deg,#FF4500 0%,var(--coral) 100%);
  z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;opacity:0;pointer-events:none;transition:opacity .3s
}
#emg-overlay.show{opacity:1;pointer-events:all}
#emg-x{
  position:absolute;top:20px;left:20px;width:44px;height:44px;
  background:rgba(255,255,255,.25);border-radius:50%;font-size:20px;color:white;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)
}
.emg-sname{font-size:14px;font-weight:600;color:rgba(255,255,255,.90);text-align:center;margin-bottom:16px;max-width:280px;line-height:1.4}
#emg-arrow{font-size:130px;line-height:1;color:white;text-shadow:0 4px 20px rgba(0,0,0,.2);margin-bottom:16px;transition:opacity .2s}
#emg-dist{font-size:54px;font-weight:900;color:white;line-height:1;margin-bottom:8px}
.emg-addr{font-size:16px;font-weight:700;color:rgba(255,255,255,.95);text-align:center;margin-bottom:6px}
.emg-meta{font-size:13px;color:rgba(255,255,255,.75);text-align:center;margin-bottom:32px}
#emg-show-map{
  background:white;color:var(--coral);font-size:15px;font-weight:800;
  padding:15px 32px;border-radius:var(--r-xl);min-height:50px;box-shadow:0 4px 20px rgba(0,0,0,.20)
}
#emg-no-gps{font-size:16px;font-weight:600;color:white;text-align:center;line-height:1.6;padding:20px}

/* ===== LIST VIEW ===== */
#list-view{
  position:absolute;
  inset:calc(var(--topbar-h) + var(--filter-h)) 0 0 0;
  background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  z-index:300;display:none;padding:12px 16px 100px
}
#list-view.show{display:block}
.lcard{
  background:white;border-radius:0;padding:14px 16px;margin-bottom:0;
  display:flex;align-items:center;gap:12px;cursor:pointer;
  box-shadow:none;border:none;border-bottom:1px solid var(--border);
  transition:background .12s;min-height:64px;
  border-right:3px solid transparent
}
.lcard:first-child{border-radius:13px 13px 0 0}
.lcard:last-child{border-radius:0 0 13px 13px;border-bottom:none}
.lcard:only-child{border-radius:13px}
.lcard:hover{background:var(--sky);transform:none;box-shadow:none}
.lcard-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.lcard-info{flex:1;min-width:0}
.lcard-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.lcard-addr{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard-dist{font-size:14px;font-weight:700;color:var(--text2);flex-shrink:0}

/* ===== SHIMMER ===== */
.shimmer{background:linear-gradient(90deg,var(--bg) 25%,#dce9e8 50%,var(--bg) 75%);background-size:200% 100%;animation:shim 1.2s infinite;border-radius:var(--r-md)}
@keyframes shim{to{background-position:-200% 0}}
.shim-card{height:64px;margin:0 14px 8px}

/* ===== LEAFLET OVERRIDES ===== */
.leaflet-control-zoom{border:none!important;box-shadow:var(--sh-md)!important;border-radius:var(--r-sm)!important;overflow:hidden}
.leaflet-control-zoom a{border:none!important;border-bottom:1px solid var(--border)!important;font-size:16px!important;font-family:var(--font)!important;font-weight:700!important;width:40px!important;height:40px!important;line-height:40px!important;color:var(--blue)!important;background:white!important}
.leaflet-control-zoom a:last-child{border-bottom:none!important}

/* Recenter button */
#recenter-btn{
  display:none;
  width:40px;height:40px;
  background:white;border-radius:var(--r-sm);
  box-shadow:var(--sh-md);
  font-size:18px;color:var(--blue);
  align-items:center;justify-content:center;
  border:none;
  margin-bottom:4px;
  transition:background .15s;
}
#recenter-btn.show{display:flex}
#recenter-btn:hover{background:var(--sky)}
/* Position recenter above zoom controls bottom-right */
.leaflet-bottom.leaflet-right{display:flex;flex-direction:column;align-items:flex-end;padding:0 10px 96px}
@media(min-width:768px){.leaflet-bottom.leaflet-right{padding:0 10px 10px}}
.leaflet-popup-content-wrapper,.leaflet-popup-tip-container{display:none!important}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:transparent!important}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:transparent!important}

/* ===== DESKTOP OVERRIDES ===== */
@media(min-width:768px){
  #welcome{display:none!important}
  #topbar,#filterbar,#gps-pill,#emg-bar,#view-toggle,#list-view{display:none!important}
  #sidebar{display:flex}
  #drawer{
    position:static!important;transform:none!important;border-radius:0!important;
    box-shadow:none!important;background:transparent!important;backdrop-filter:none!important;
    -webkit-backdrop-filter:none!important;max-height:none!important;display:none
  }
  #drw-bg{display:none!important}
  #drawer.open{display:block}
  .drw-handle{display:none}
  #map{padding-top:0!important}
  .sb-content #list-view{
    position:static!important;inset:unset!important;z-index:1!important;
    padding:0 0 80px!important;background:transparent!important;display:block!important
  }
  .sb-content .lcard{border-radius:0;margin:0 14px;border-bottom:1px solid var(--border);box-shadow:none}
  .sb-content .lcard:first-child{border-radius:13px 13px 0 0}
  .sb-content .lcard:last-child{border-radius:0 0 13px 13px;border-bottom:none}
  .sb-content .lcard:only-child{border-radius:13px}
}
</style>
</head>
<body>

<!-- MOBILE TOP BAR -->
<div id="topbar">
  <div class="tb-row1">
    <div class="tb-center">
      <div class="tb-name" id="m-sub"><span style="color:#1BBCB3">גינה</span> <span style="color:#1C2D5E">בטוחה</span></div>
    </div>
    <div id="tb-lang-sw" class="tb-lang-sw">
      <button class="lang-btn active" onclick="setLang('he')">עב</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('fr')">FR</button>
    </div>
    <button class="tb-menu" onclick="openSrch()">🔍</button>
  </div>
  <div class="tb-row2">
    <div class="tb-pills">
      <button class="tb-pill red" id="tb-sh-pill" onclick="toggleShFilter()" title="מקלטים">🛡️</button>
      <button class="tb-pill green active-filter" id="tb-pg-pill" onclick="togglePgFilter()" title="מגרשים">🛝</button>
    </div>
  </div>
</div>

<!-- FILTER BAR (hidden on mobile, kept for desktop) -->
<div id="filterbar">
  <button class="fp active" data-f="all" onclick="setFilter('all')">הכל</button>
  <button class="fp" data-f="playgrounds" onclick="setFilter('playgrounds')">🛝 גינות</button>
  <button class="fp" data-f="shelters" onclick="setFilter('shelters')">🛡️ מקלטים</button>
</div>

<!-- APP WRAPPER -->
<div id="app">

  <!-- SIDEBAR (desktop) -->
  <div id="sidebar">
    <div class="sb-topbar">
      <div class="tb-left">
        <span class="tb-logo" style="font-size:26px">🐦</span>
        <div class="tb-text">
          <span class="tb-name" style="font-size:20px;font-weight:800;letter-spacing:-0.5px"><span style="color:#1BBCB3">גינה</span> <span style="color:#1C2D5E">בטוחה</span></span>
          <span class="tb-tagline" id="sb-sub" style="display:block;font-size:11px;color:#7B8BAA;margin-top:1px">גינות · מקלטים · בטחון</span>
        </div>
      </div>
      <div id="sb-lang-sw">
        <button class="lang-btn active" onclick="setLang('he')">עב</button>
        <button class="lang-btn" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('fr')">FR</button>
      </div>
    </div>
    <div class="sb-search-wrap">
      <input class="sb-search" id="sb-search" type="text" placeholder="חפש שכונה, רחוב או עיר..."
        oninput="onSrchInput(this.value,true)" onkeydown="onSrchKey(event,true)" autocomplete="off">
      <div id="sb-srch-results"></div>
    </div>
    <div class="sb-filterbar">
      <button class="fp active" data-f="all" onclick="setFilter('all')">הכל</button>
      <button class="fp" data-f="playgrounds" onclick="setFilter('playgrounds')">🛝 גינות</button>
      <button class="fp" data-f="shelters" onclick="setFilter('shelters')">🛡️ מקלטים</button>
    </div>
    <div class="sb-content" id="sb-content">
      <div id="sb-gps-card" class="sb-gps-card" style="display:none">
        <p id="sb-gps-p">הפעל מיקום לראות גינות קרוב אליך</p>
        <button class="sb-gps-btn" onclick="requestGPS()">📍 <span id="sb-gps-lbl">הפעל מיקום</span></button>
      </div>
      <!-- list is injected here on desktop -->
      <div id="sb-list"></div>
      <!-- drawer detail is injected here on desktop -->
      <div id="drawer"></div>
    </div>
    <div class="sb-emergency">
      <button class="sb-emg-btn dimmed" id="sb-emg-btn" onclick="onEmgTap()">
        🚨 <span id="sb-emg-lbl">הפעל מיקום לניווט רגלי מהיר</span>
      </button>
    </div>
  </div>

  <!-- MAP AREA -->
  <div id="map-area">
    <!-- Fake map placeholder (shown before location is granted, no network needed) -->

      <!-- Playground pins: teal rounded-square tile with swing SVG -->

          <line x1="5" y1="4" x2="5" y2="19"/><line x1="19" y1="4" x2="19" y2="19"/>
          <line x1="5" y1="5" x2="19" y2="5"/>
          <line x1="7" y1="5" x2="12" y2="14"/><line x1="17" y1="5" x2="12" y2="14"/>
          <rect x="9" y="14" width="6" height="3" rx="1.5"/>
        </svg>
      </div>
      <div class="fp-pin pg" style="top:50%;left:30%;animation-delay:1.5s">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round">
          <line x1="5" y1="4" x2="5" y2="19"/><line x1="19" y1="4" x2="19" y2="19"/>
          <line x1="5" y1="5" x2="19" y2="5"/>
          <line x1="7" y1="5" x2="12" y2="14"/><line x1="17" y1="5" x2="12" y2="14"/>
          <rect x="9" y="14" width="6" height="3" rx="1.5"/>
        </svg>
      </div>
      <div class="fp-pin pg" style="top:65%;left:72%;animation-delay:1.2s">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round">
          <line x1="5" y1="4" x2="5" y2="19"/><line x1="19" y1="4" x2="19" y2="19"/>
          <line x1="5" y1="5" x2="19" y2="5"/>
          <line x1="7" y1="5" x2="12" y2="14"/><line x1="17" y1="5" x2="12" y2="14"/>
          <rect x="9" y="14" width="6" height="3" rx="1.5"/>
        </svg>
      </div>
      <!-- Shelter pins: orange circle+tail with house SVG -->
      <div class="fp-pin sh" style="top:30%;left:56%;animation-delay:.9s">
        <div class="fp-pin-circle">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3,12 12,4 21,12"/><rect x="7" y="12" width="10" height="9" rx="1.5"/>
            <rect x="10" y="16" width="4" height="5" rx="1"/>
          </svg>
        </div>
      </div>
      <div class="fp-pin sh" style="top:14%;left:68%;animation-delay:.6s">
        <div class="fp-pin-circle">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3,12 12,4 21,12"/><rect x="7" y="12" width="10" height="9" rx="1.5"/>
            <rect x="10" y="16" width="4" height="5" rx="1"/>
          </svg>
        </div>
      </div>
      <div class="fp-pin sh" style="top:42%;left:7%;animation-delay:1.8s">
        <div class="fp-pin-circle">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3,12 12,4 21,12"/><rect x="7" y="12" width="10" height="9" rx="1.5"/>

    </div>
    <div id="map"></div>

    <!-- Muted overlay (hidden initially — placeholder handles pre-GPS state) -->
    <div id="muted-overlay" class="hidden"></div>

    <!-- Location pill: floating bottom pill to activate geolocation -->
    <div id="loc-card">
      <div class="lc-mascot">
        <!-- Teal bird mascot reading map (matches logo) -->
        <svg class="lc-bird" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">

function hav(la1,lo1,la2,lo2){
  const R=6371000,dL=(la2-la1)*Math.PI/180,dG=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dG/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

  return(Math.atan2(y,x)*180/Math.PI+360)%360;
}

async function loadManifest(){
  // Always fetch manifest fresh (it's tiny ~3KB) so we always get the latest generatedAt
  // which is used to invalidate city file caches when data is updated
  try{
    const r=await fetch('./data/manifest.json');
    if(!r.ok)throw new Error('manifest fetch failed');
    const m=await r.json();
    try{localStorage.setItem(MANIFEST_KEY,JSON.stringify(m));}catch(e){}
    return m;
  }catch(e){
    // Fallback to cached manifest if fetch fails (offline)
    try{
      const c=localStorage.getItem(MANIFEST_KEY);
      if(c)return JSON.parse(c);
    }catch(e2){}
    throw e;
  }
}

async function loadCityFile(key){
  const cacheKey=CITY_KEY_PFX+key;
  const manifestTs=new Date(manifestData.generatedAt).getTime();
  try{
    const c=localStorage.getItem(cacheKey);
    if(c){
      const wrapper=JSON.parse(c);
      // Support both old format (raw file) and new format ({cachedAt, manifestTs, data})
      const cachedManifestTs=wrapper._manifestTs||0;
      const cachedAt=wrapper._cachedAt||0;
      const data=wrapper._data||wrapper; // fallback: old cache stored raw file
      const ageDays=(Date.now()-cachedAt)/86400000;
      if(cachedManifestTs>=manifestTs&&ageDays<DATA_TTL)return data;
    }
  }catch(e){}
  try{
    const r=await fetch(`./data/${key}.json`);
    if(!r.ok)return{shelters:[],playgrounds:[]};
    const d=await r.json();
    try{localStorage.setItem(cacheKey,JSON.stringify({_manifestTs:manifestTs,_cachedAt:Date.now(),_data:d}));}catch(e){}
    return d;
  }catch(e){return{shelters:[],playgrounds:[]};}
}

  if(!manifestData)return null;
  // Prefer named city entries first
  const city=manifestData.entries.find(e=>e.type==='city'&&lat>=e.bbox.latMin&&lat<=e.bbox.latMax&&lng>=e.bbox.lngMin&&lng<=e.bbox.lngMax);
  if(city)return city;
  // Fall back to grid tile
  const row=Math.max(0,Math.floor((lat-GRID_LAT_MIN)/GRID_STEP));
  const col=Math.max(0,Math.floor((lng-GRID_LNG_MIN)/GRID_STEP));
  const tileKey=`tile_${row}_${col}`;
  return manifestData.entries.find(e=>e.key===tileKey)||null;
}

// Return all manifest entries needed for a location (home + neighbours)
function entriesForLocation(lat,lng){
  if(!manifestData)return[];
  const needed=new Set();
  const home=entryForCoords(lat,lng);
  if(home)needed.add(home.key);
  // Add adjacent entries (within ~50km buffer)
  const buf=0.45;
  const offsets=[[buf,0],[-buf,0],[0,buf],[0,-buf]];
  offsets.forEach(([dLat,dLng])=>{
    const e=entryForCoords(lat+dLat,lng+dLng);
    if(e)needed.add(e.key);
  });
  return [...needed].map(k=>manifestData.entries.find(e=>e.key===k)).filter(Boolean);
}

function mergeFilesIntoAppData(files){
  files.forEach(file=>{
    (file.shelters||[]).forEach(s=>{if(!itemMap.has(s.id)){appData.shelters.push(s);itemMap.set(s.id,s);}});
    (file.playgrounds||[]).forEach(p=>{if(!itemMap.has(p.id)){appData.playgrounds.push(p);itemMap.set(p.id,p);}});
  });
}

  // Shelter marker — teardrop pin with shelter building icon (matches logo)

  map=L.map('map',{center:[31.5,35.0],zoom:8,zoomControl:false,attributionControl:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
  const RecenterCtrl=L.Control.extend({options:{position:'bottomright'},onAdd:function(){
    const btn=L.DomUtil.create('button','');
    btn.id='recenter-btn';btn.innerHTML='📍';btn.title='מצא אותי';
    btn.setAttribute('style','cursor:pointer');
    L.DomEvent.on(btn,'click',recenterMap);
    L.DomEvent.disableClickPropagation(btn);
    return btn;
  }});
  new RecenterCtrl().addTo(map);
  L.control.zoom({position:'bottomright'}).addTo(map);
  pgCluster=L.markerClusterGroup({maxClusterRadius:50,disableClusteringAtZoom:16,spiderfyOnMaxZoom:true,showCoverageOnHover:false,iconCreateFunction:clusterIcon('#4ECBA0','rgba(78,203,160,.4)')});
  shCluster=L.markerClusterGroup({maxClusterRadius:50,disableClusteringAtZoom:16,spiderfyOnMaxZoom:true,showCoverageOnHover:false,iconCreateFunction:clusterIcon('#FF6B35','rgba(255,107,53,.4)')});
  shCluster.addTo(map);pgCluster.addTo(map);

  // Pan-triggered lazy tile/city loading
  map.on('moveend',()=>{
    if(!appData||!manifestData||map.getZoom()<11)return;
    const c=map.getCenter();
    const needed=entriesForLocation(c.lat,c.lng).filter(e=>!loadedFileKeys.has(e.key)&&!pendingFileKeys.has(e.key));
    if(!needed.length)return;
    needed.forEach(e=>pendingFileKeys.add(e.key));
    Promise.all(needed.map(e=>loadCityFile(e.key))).then(files=>{
      files.forEach((file,i)=>{
        const key=needed[i].key;
        pendingFileKeys.delete(key);
        loadedFileKeys.add(key);
        const newSh=[],newPg=[];
        (file.shelters||[]).forEach(s=>{if(!itemMap.has(s.id)){appData.shelters.push(s);itemMap.set(s.id,s);newSh.push(s);}});
        (file.playgrounds||[]).forEach(p=>{if(!itemMap.has(p.id)){appData.playgrounds.push(p);itemMap.set(p.id,p);newPg.push(p);}});
        // Add new markers without clearing existing ones
        newPg.forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:PG_ICON});m.on('click',()=>openDrawer(p,'playground'));pgCluster.addLayer(m);});
        newSh.forEach(s=>{const m=L.marker([s.lat,s.lng],{icon:SH_ICON});m.on('click',()=>openDrawer(s,'shelter'));shCluster.addLayer(m);});
      });
    });
  });
}

async function detectIP(){
  try{
    const r=await fetch('https://ip-api.com/json?fields=city,lat,lon,status',{signal:AbortSignal.timeout(2000)});
    if(!r.ok)return null;
    const d=await r.json();
    if(d.status==='success'&&d.lat)return{city:d.city,lat:d.lat,lng:d.lon};
  }catch(e){}
  return null;
}

function requestGPS(){
  if(!navigator.geolocation){alert(t('browserNoGPS'));return;}
  // Show loading indicator on the card button
  const btn=document.getElementById('card-gps-btn');
  if(btn){btn.disabled=true;btn.innerHTML=`⏳ <span>${t('reqLoc')}</span>`;}
  navigator.geolocation.getCurrentPosition(
    p=>{
      if(btn){btn.disabled=false;btn.innerHTML='<span id="card-gps-lbl">'+t('enableLoc')+'</span>';}
      if(appData){
        // Data already loaded (desktop or second call)
        if(!mapInitialized){initMap();mapInitialized=true;map.invalidateSize();}
        hidePlaceholder();
        onLocKnown(p.coords.latitude,p.coords.longitude);
      } else {
        // Mobile first-time: load data now that we have GPS
        loadAppData({lat:p.coords.latitude,lng:p.coords.longitude});
      }
    },
    e=>{
      if(btn){btn.disabled=false;btn.innerHTML='<span id="card-gps-lbl">'+t('enableLoc')+'</span>';}
      if(e.code===e.PERMISSION_DENIED){
        // Permission denied: open search bar immediately, data loads lazily when they pick a location
        openSrch(true);
      }
    },
    {enableHighAccuracy:true,timeout:10000}
  );
}

function onLocKnown(lat,lng){
  userLoc={lat,lng};
  const lc=document.getElementById('loc-card');if(lc)lc.classList.add('hidden');
  const mo=document.getElementById('muted-overlay');if(mo)mo.classList.add('hidden');
  const gp=document.getElementById('gps-pill');if(gp)gp.classList.add('hidden');
  const lp=document.getElementById('loc-prompt-card');if(lp)lp.style.display='none';
  if(userMarker)map.removeLayer(userMarker);
  userMarker=L.marker([lat,lng],{icon:dotIcon(),zIndexOffset:1000}).addTo(map);
  renderPins(); // replace preview pins with full-opacity pins
  map.flyTo([lat,lng],15,{duration:1.2});
  map.once('moveend',filterPinsToView);
  setEmgReady(true);
  updateUserLine();
  if(watchId)navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(
    p=>{
      userLoc={lat:p.coords.latitude,lng:p.coords.longitude};
      if(userMarker)userMarker.setLatLng([userLoc.lat,userLoc.lng]);
      updateUserLine();
      if(emgActive)updateEmg();
    },
    null,{enableHighAccuracy:true,maximumAge:2000}
  );
  const gc=document.getElementById('sb-gps-card');if(gc)gc.style.display='none';
  const rb=document.getElementById('recenter-btn');if(rb)rb.classList.add('show');
  renderList();
  if(drwItem&&drwType)openDrawer(drwItem,drwType,true);
}

function recenterMap(){
  if(!userLoc)return;
  map.flyTo([userLoc.lat,userLoc.lng],15,{duration:1});
}

function setEmgReady(on){
  const txt=on?t('emgOn'):t('emgOff');
  ['emg-btn','sb-emg-btn'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.classList.toggle('dimmed',!on);
    const sp=el.querySelector('span');if(sp)sp.textContent=txt;
  });
}

function openSrch(alert=false){
  if(mobile()){
    document.getElementById('srch-wrap').classList.add('show');
    const inp=document.getElementById('srch-input');inp.focus();
    if(alert){
      inp.classList.add('alert');
      const a=document.getElementById('srch-alert');a.textContent=t('noGPS');a.classList.add('show');
      setTimeout(()=>{inp.classList.remove('alert');},2000);
    }
  } else {
    const inp=document.getElementById('sb-search');
    if(inp){inp.focus();if(alert){inp.classList.add('alert');setTimeout(()=>inp.classList.remove('alert'),2000);}}
  }
}
function closeSrch(){
  document.getElementById('srch-wrap').classList.remove('show');
  document.getElementById('srch-results').innerHTML='';
  document.getElementById('srch-alert').classList.remove('show');
  document.getElementById('srch-input').value='';
  srchRes=[];
}
function onSrchInput(val,isSb){
  clearTimeout(srchDebounce);
  const el=isSb?document.getElementById('sb-srch-results'):document.getElementById('srch-results');
  if(!el)return;
  if(val.length<2){el.innerHTML='';return;}
  srchDebounce=setTimeout(()=>doSrch(val,isSb),400);
}
function onSrchKey(e,isSb){if(e.key==='Enter'&&srchRes.length>0)selSrchRes(srchRes[0]);}
async function doSrch(q,isSb){
  const el=isSb?document.getElementById('sb-srch-results'):document.getElementById('srch-results');
  if(el)el.innerHTML=`<div class="srch-item srch-loading">${t('searching')}</div>`;
  try{
    const url=`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&countrycodes=il&limit=5&accept-language=he`;
    const r=await fetch(url,{headers:{'User-Agent':'GinahBtucha/1.0'},signal:AbortSignal.timeout(5000)});
    srchRes=await r.json();
    if(srchRes.length===0){if(el)el.innerHTML=`<div class="srch-item srch-empty">${t('noResults')}</div>`;return;}
    renderSrchRes(srchRes,isSb);
  }catch(e){if(el)el.innerHTML=`<div class="srch-item srch-empty">${t('srchErr')}</div>`;}
}
function renderSrchRes(results,isSb){
  const el=isSb?document.getElementById('sb-srch-results'):document.getElementById('srch-results');
  if(!el)return;
  el.innerHTML=results.map((r,i)=>`<div class="srch-item" onclick="selSrchRes(srchRes[${i}])">${r.display_name.split(',').slice(0,2).join(', ')}</div>`).join('');
}
function selSrchRes(r){
  closeSrch();
  const sbEl=document.getElementById('sb-search');if(sbEl)sbEl.value='';
  const sr=document.getElementById('sb-srch-results');if(sr)sr.innerHTML='';
  const lat=parseFloat(r.lat),lng=parseFloat(r.lon);
  if(!appData){
    loadAppData({lat,lng});
  } else {
    if(!mapInitialized){initMap();mapInitialized=true;map.invalidateSize();}
    hidePlaceholder();
    onLocKnown(lat,lng);
  }
}

function openDrawer(item,type,refresh=false){
  drwItem=item;drwType=type;
  const drw=document.getElementById('drawer');
  drw.classList.remove('pg','sh');
  drw.classList.add(type==='playground'?'pg':'sh');
  drw.innerHTML=type==='playground'?buildPgDrw(item):buildShDrw(item);

  if(mobile()){
    if(drw.parentElement!==document.body)document.body.appendChild(drw);
    drw.classList.add('open');
    document.getElementById('drw-bg').classList.add('show');
    document.getElementById('emg-bar').style.display='none';
    drw.scrollTop=0;
    if(!refresh)map.panBy([0,-120],{animate:true});
  } else {
    document.getElementById('sb-list').style.display='none';
    const gc=document.getElementById('sb-gps-card');if(gc)gc.style.display='none';
    drw.style.display='block';
    map.panTo([item.lat,item.lng],{animate:true});
  }

}

function onEmgTap(){
  if(!userLoc){openSrch(true);return;}
  openEmg();
}
function openEmg(){
  const ns=nearSh(userLoc.lat,userLoc.lng,1)[0];
  if(!ns)return;
  emgActive=true;nearShCache=ns;
  const d=hav(userLoc.lat,userLoc.lng,ns.lat,ns.lng);
  const b=brng(userLoc.lat,userLoc.lng,ns.lat,ns.lng);
  document.getElementById('emg-sname').textContent=shLabel(ns)||ns.city||'';
  document.getElementById('emg-arrow').textContent=arrow(b);
  document.getElementById('emg-arrow').setAttribute('aria-label','כיוון: '+arrow(b));
  document.getElementById('emg-dist').textContent=fDist(d);
  document.getElementById('emg-addr').textContent=shLabel(ns)||ns.city||'';
  document.getElementById('emg-meta').textContent=[typeLabel(ns.type),ns.accessible?t('acc'):''].filter(Boolean).join(' · ');
  document.getElementById('emg-no-gps').style.display='none';
  document.getElementById('emg-arrow').style.display='';
  document.getElementById('emg-dist').style.display='';
  document.getElementById('emg-overlay').classList.add('show');
  setTimeout(()=>document.getElementById('emg-x').focus(),100);
}
let emgUpdateCount=0;
function updateEmg(){
  if(!userLoc||!nearShCache)return;
  emgUpdateCount++;
  if(emgUpdateCount%5===0){
    const ns=nearSh(userLoc.lat,userLoc.lng,1)[0];
    if(ns)nearShCache=ns;
  }
  const d=hav(userLoc.lat,userLoc.lng,nearShCache.lat,nearShCache.lng);
  const b=brng(userLoc.lat,userLoc.lng,nearShCache.lat,nearShCache.lng);
  document.getElementById('emg-arrow').textContent=arrow(b);
  document.getElementById('emg-dist').textContent=fDist(d);
}
function closeEmg(){emgActive=false;document.getElementById('emg-overlay').classList.remove('show');}
document.addEventListener('keydown',function(e){
  const overlay=document.getElementById('emg-overlay');
  if(!overlay||!overlay.classList.contains('show'))return;
  if(e.key!=='Tab')return;
  const focusable=[document.getElementById('emg-x'),document.getElementById('emg-show-map')].filter(Boolean);
  if(focusable.length===0)return;
  const first=focusable[0],last=focusable[focusable.length-1];
  if(e.shiftKey){if(document.activeElement===first){e.preventDefault();last.focus();}}
  else{if(document.activeElement===last){e.preventDefault();first.focus();}}
});
function emgShowMap(){
  closeEmg();
  if(nearShCache){map.flyTo([nearShCache.lat,nearShCache.lng],16,{duration:1});openDrawer(nearShCache,'shelter');}
}

// ===========================
// FILTER & VIEW
// ===========================
function setFilter(f){
  filter=f;
  document.querySelectorAll('.fp').forEach(el=>{el.classList.toggle('active',el.dataset.f===f);el.setAttribute('aria-pressed',el.dataset.f===f?'true':'false');});
  if(!map)return;
  const hasP=map.hasLayer(pgCluster),hasS=map.hasLayer(shCluster);
  if(f==='all'){if(!hasP)map.addLayer(pgCluster);if(!hasS)map.addLayer(shCluster);}
  else if(f==='playgrounds'){if(!hasP)map.addLayer(pgCluster);if(hasS)map.removeLayer(shCluster);}
  else{if(hasP)map.removeLayer(pgCluster);if(!hasS)map.addLayer(shCluster);}
  // Update list title
  const lt=document.getElementById('list-title');
  if(lt)lt.textContent=f==='shelters'?t('nearbySh'):t('nearbyPg');
  if(appData)renderList();
}

// Header pill toggles for mobile
function toggleShFilter(){
  const isActive=filter==='shelters';
  setFilter(isActive?'all':'shelters');
  document.getElementById('tb-sh-pill').classList.toggle('active-filter',!isActive);
  document.getElementById('tb-pg-pill').classList.toggle('active-filter',isActive||filter==='all');
}
function togglePgFilter(){
  const isActive=filter==='playgrounds';
  setFilter(isActive?'all':'playgrounds');
  document.getElementById('tb-pg-pill').classList.toggle('active-filter',!isActive);
  document.getElementById('tb-sh-pill').classList.toggle('active-filter',isActive||filter==='all');
}

function setView(v){
  view=v;
  document.getElementById('vt-map')&&document.getElementById('vt-map').classList.toggle('active',v==='map');
  document.getElementById('vt-list')&&document.getElementById('vt-list').classList.toggle('active',v==='list');
  document.getElementById('list-view')&&document.getElementById('list-view').classList.toggle('show',v==='list');
}

// ===========================
// LIST VIEW
// ===========================
function renderList(){
  if(!appData)return;
  let items=[];
  if(filter!=='shelters')appData.playgrounds.forEach(p=>items.push({...p,_t:'playground'}));
  if(filter!=='playgrounds')appData.shelters.forEach(s=>items.push({...s,_t:'shelter'}));
  if(userLoc){
    items.forEach(it=>{it._d=hav(userLoc.lat,userLoc.lng,it.lat,it.lng);});
    items.sort((a,b)=>a._d-b._d);
  } else {
    // Without GPS, hide anonymous items (no name or address) — they're indistinguishable
    items=items.filter(it=>(it.name&&it.name.trim())||(it.address&&it.address.trim())||it._t==='shelter');
    items.sort((a,b)=>(a.name||a.address||'').localeCompare(b.name||b.address||''));
  }
  const html=items.slice(0,120).map(it=>{
    const tp=it._t,nm=tp==='playground'?pgLabel(it):(shLabel(it)||it.city||'');
    const ad=(it.address&&it.address.trim())?it.address:(it.city||'');
    const pgSvg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none"><line x1="4" y1="2" x2="4" y2="22" stroke="#4ECBA0" stroke-width="2" stroke-linecap="round"/><line x1="20" y1="2" x2="20" y2="22" stroke="#4ECBA0" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="2" x2="20" y2="2" stroke="#4ECBA0" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="5" x2="12" y2="15" stroke="#4ECBA0" stroke-width="1.8" stroke-linecap="round"/><line x1="20" y1="5" x2="12" y2="15" stroke="#4ECBA0" stroke-width="1.8" stroke-linecap="round"/><rect x="9" y="13" width="6" height="4" rx="2" fill="#4ECBA0"/></svg>`;
    const shSvg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none"><rect x="4" y="11" width="16" height="10" rx="1.5" fill="#FF6B35"/><path d="M2 12 L12 4 L22 12" stroke="#FF6B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="9" y="15" width="6" height="6" rx="1" fill="white"/></svg>`;
    const ic=tp==='playground'?pgSvg:shSvg;
    const bg=tp==='playground'?'background:rgba(78,203,160,0.12)':'background:rgba(255,107,53,0.10)';
    const distStr=userLoc&&it._d!==undefined?`<span class="lcard-dist">${arrow(brng(userLoc.lat,userLoc.lng,it.lat,it.lng))} ${fDist(it._d)}</span>`:'';
    return `<div class="lcard" data-id="${esc(it.id)}" data-type="${tp}">
      <div class="lcard-icon" style="${bg}">${ic}</div>
      <div class="lcard-info"><div class="lcard-name">${esc(nm)}</div><div class="lcard-addr">${esc(ad)}</div></div>
      ${distStr}
    </div>`;
  }).join('');
  const ml=document.getElementById('list-view');
  if(ml){
    ml.innerHTML=html;ml.style.padding='8px 12px 0';
    if(!listViewListenerAdded){
      listViewListenerAdded=true;
      ml.addEventListener('click',e=>{const card=e.target.closest('.lcard');if(card){const item=itemMap.get(card.dataset.id);if(item)openDrawer(item,card.dataset.type);}});
    }
  }
  const sl=document.getElementById('sb-list');
  if(sl){
    sl.innerHTML=html;
    if(!sbListListenerAdded){
      sbListListenerAdded=true;
      sl.addEventListener('click',e=>{const card=e.target.closest('.lcard');if(card){const item=itemMap.get(card.dataset.id);if(item)openDrawer(item,card.dataset.type);}});
    }
  }
  // Update count in list header
  const lc=document.getElementById('list-count');
  if(lc)lc.textContent=items.length>0?items.length+' מגרשים':'';
}

  lang=l;
  document.documentElement.lang=l;
  document.documentElement.dir=(l==='he')?'rtl':'ltr';
  document.querySelectorAll('.lang-btn').forEach(b=>{

  const ids={
    'sb-sub':t('sub'),
    'gps-pill-lbl':t('find'),'card-gps-lbl':t('enableLoc'),
    'card-srch-lbl':t('srchAddr'),'lc-sub':t('cardSub'),
    'lc-city':t('locTitle'),
    'load-text':t('loading'),'sb-gps-p':t('gpsTxt'),
    'sb-gps-lbl':t('enableLoc'),'mod-photo-btn-lbl':t('addPhoto'),
    'mod-title':t('revMod'),'mod-stars-lbl':t('starsLbl'),
    'mod-name-lbl':t('nameLbl'),'mod-cmt-lbl':t('cmtLbl'),'mod-photo-lbl':t('photoLbl'),
    'rev-submit':t('submitRev'),
  };
  Object.entries(ids).forEach(([id,val])=>{const el=document.getElementById(id);if(el)el.textContent=val;});
  const srchInp=document.getElementById('srch-input');if(srchInp)srchInp.placeholder=t('srchPh');
  const sbSrch=document.getElementById('sb-search');if(sbSrch)sbSrch.placeholder=t('srchPh');
  document.querySelectorAll('[data-f]').forEach(el=>{
    if(el.dataset.f==='all')el.textContent=t('all');
    if(el.dataset.f==='playgrounds')el.textContent=t('fPlay');
    if(el.dataset.f==='shelters')el.textContent=t('fSh');
  });
  setEmgReady(!!userLoc);
  if(appData)renderList();
  if(drwItem)openDrawer(drwItem,drwType,true);
}

// ===========================
// REVIEWS
// ===========================
async function loadRevs(locId,locType){
  const sec=document.getElementById('rev-sec');if(!sec)return;
  try{
    const client=getSb();if(!client)throw new Error('supabase not ready');
    const{data,error}=await client.from('reviews').select('*').eq('location_id',locId).order('created_at',{ascending:false}).limit(20);
    if(error)throw error;
    sec.innerHTML=buildRevSec(data,locId,locType);
  }catch(e){
    sec.innerHTML=`<div class="rev-err">${t('revUnavail')}</div><button class="btn-add-rev" onclick="openRevModal('${locId}','${locType}')">${t('addRev')}</button>`;
  }
}

function buildRevSec(revs,locId,locType){
  let h='<div class="drw-div"></div>';
  if(revs&&revs.length>0){
    const avg=revs.reduce((s,r)=>s+r.stars,0)/revs.length;
    h+=`<div class="rev-summary"><span class="rev-avg">${avg.toFixed(1)}</span><span class="rev-stars">${stars(avg)}</span><span class="rev-count">· ${revs.length} ${t('revT')}</span></div>`;
    h+=revs.map(r=>`<div class="rev-card">
      <div class="rev-chdr"><span class="rev-cname">${esc(r.nickname)}</span><span class="rev-ctime">${timeAgo(r.created_at)}</span></div>
      <div class="rev-cstars">${stars(r.stars)}</div>
      ${r.comment?`<div class="rev-ctext">${esc(r.comment)}</div>`:''}
      ${r.photo_url?`<div class="rev-cphoto"><img src="${r.photo_url}" alt="" loading="lazy"></div>`:''}
    </div>`).join('');
  } else {
    h+=`<div class="rev-empty">${t('noRev')}</div>`;
  }
  h+=`<button class="btn-add-rev" onclick="openRevModal('${locId}','${locType}')">${t('addRev')}</button>`;
  return h;
}

function openRevModal(locId,locType){
  revLocId=locId;revLocType=locType;selStars=0;selPhoto=null;
  document.getElementById('rev-nick').value=localStorage.getItem(NICK_KEY)||'';
  document.getElementById('rev-cmt').value='';
  document.getElementById('photo-prev').classList.remove('show');
  updStars(0);
  document.getElementById('rev-modal-bg').classList.add('show');
}
function closeRevModal(){document.getElementById('rev-modal-bg').classList.remove('show');}
function revBgTap(e){if(e.target===document.getElementById('rev-modal-bg'))closeRevModal();}
function pickStar(n){selStars=n;updStars(n);}
function updStars(n){document.querySelectorAll('.star-btn').forEach(b=>{const s=parseInt(b.dataset.s);b.textContent=s<=n?'★':'☆';b.classList.toggle('sel',s===n);});}
function onPhotoSel(e){
  const f=e.target.files[0];if(!f)return;selPhoto=f;
  const r=new FileReader();r.onload=ev=>{document.getElementById('photo-prev-img').src=ev.target.result;document.getElementById('photo-prev').classList.add('show');};r.readAsDataURL(f);
}
async function resizeImg(file,max=800){
  return new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const sc=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*sc),h=Math.round(img.height*sc);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);c.toBlob(b=>res(b),'image/jpeg',.85);
    };img.src=url;
  });
}
async function submitRev(){
  const nick=document.getElementById('rev-nick').value.trim();
  const cmt=document.getElementById('rev-cmt').value.trim();
  const btn=document.getElementById('rev-submit');
  if(!selStars){alert(t('starsLbl'));return;}
  if(!nick){document.getElementById('rev-nick').focus();return;}
  btn.disabled=true;btn.textContent='...';
  try{
    let photoUrl=null;
    if(selPhoto){
      const blob=await resizeImg(selPhoto);
      const path=`${revLocId}/${Date.now()}.jpg`;
      const client2=getSb();if(!client2)throw new Error('supabase not ready');
      const{data:up,error:ue}=await client2.storage.from('review-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});
      if(!ue&&up){const{data:{publicUrl}}=client2.storage.from('review-photos').getPublicUrl(path);photoUrl=publicUrl;}
    }
    const client3=getSb();if(!client3)throw new Error('supabase not ready');
    const{error}=await client3.from('reviews').insert({location_id:revLocId,location_type:revLocType,nickname:nick,stars:selStars,comment:cmt||null,photo_url:photoUrl});
    if(error)throw error;
    localStorage.setItem(NICK_KEY,nick);
    closeRevModal();
    loadRevs(revLocId,revLocType);
  }catch(e){alert(t('revSaveErr'));}
  finally{btn.disabled=false;btn.textContent=t('submitRev');}
}

// ===========================
// LAYOUT
// ===========================
function layout(){
  const isD=window.innerWidth>=768;
  if(isD){
    document.getElementById('topbar').style.display='none';
    document.getElementById('filterbar').style.display='none';
    document.getElementById('map').style.paddingTop='0';
  } else {
    // Split-screen: map fixed below topbar, bottom-sheet below map — no padding needed on map
    document.getElementById('map').style.paddingTop='0';
    const drw=document.getElementById('drawer');
    if(drw&&drw.parentElement!==document.body)document.body.appendChild(drw);
  }
  if(map)map.invalidateSize();
}

// ===========================
// INIT
// ===========================
let mapInitialized=false;

function init(){
  layout();
  window.addEventListener('resize',()=>{if(mapInitialized)map.invalidateSize();layout();});

  if(window.innerWidth>=768){
    // Desktop: init map + load data immediately
    initMap();mapInitialized=true;
    loadAppData(null); // no GPS yet, will use IP
  }
  // Mobile: show placeholder + loc-card, wait for user to tap GPS or search
  // Leaflet only initialises after location is known
}

async function loadAppData(coordsOrNull){
  // Migrate old monolithic cache key from previous version
  try{localStorage.removeItem('letsgoplay_data');}catch(e){}

  const lo=document.getElementById('loading-overlay');
  lo.classList.add('show');lo.classList.remove('hidden');

  // Load manifest + optional IP in parallel
  let ip=null;
  try{
    const results=await Promise.all([
      coordsOrNull?Promise.resolve(null):detectIP(),
      loadManifest()
    ]);
    ip=results[0];
    manifestData=results[1];
  }catch(e){
    lo.classList.add('hidden');setTimeout(()=>lo.classList.remove('show'),400);
    document.getElementById('load-text').textContent=t('errorLoad');
    const lcCity=document.getElementById('lc-city');if(lcCity)lcCity.textContent=t('errorLoad');
    const lcSub=document.getElementById('lc-sub');if(lcSub)lcSub.textContent=t('retryLoad');
    const lcCard=document.getElementById('loc-card');if(lcCard)lcCard.classList.remove('hidden');
    return;
  }

  // Determine center for file selection
  const lat=coordsOrNull?coordsOrNull.lat:(ip?ip.lat:32.0853);
  const lng=coordsOrNull?coordsOrNull.lng:(ip?ip.lng:34.7818);

  // Fetch the files covering this location
  const entries=entriesForLocation(lat,lng);
  const files=await Promise.all(entries.map(e=>loadCityFile(e.key)));

  // Build appData from fetched files
  appData={generatedAt:manifestData.generatedAt,shelters:[],playgrounds:[]};
  entries.forEach(e=>loadedFileKeys.add(e.key));
  mergeFilesIntoAppData(files);

  lo.classList.add('hidden');
  setTimeout(()=>lo.classList.remove('show'),400);

  if(coordsOrNull){
    if(!mapInitialized){initMap();mapInitialized=true;map.invalidateSize();}
    hidePlaceholder();
    onLocKnown(coordsOrNull.lat,coordsOrNull.lng);
  } else {
    if(!mapInitialized){initMap();mapInitialized=true;}
    hidePlaceholder();
    map.invalidateSize();
    map.flyTo([lat,lng],13,{duration:1.5});
    showCityPreview(lat,lng);
    renderList();
    const gc=document.getElementById('sb-gps-card');if(gc&&!userLoc)gc.style.display='';
  }
}

function hidePlaceholder(){
  const ph=document.getElementById('map-placeholder');
  if(ph){ph.style.transition='opacity .4s';ph.style.opacity='0';setTimeout(()=>ph.style.display='none',400);}
  const eb=document.getElementById('emg-bar');if(eb)eb.style.display='';
}

function showCityPreview(lat,lng){
  // Show only playground pins within 5km — no shelters by default (too many)
  if(!appData)return;
  const radius=5000;
  const pi=pgIcon();
  appData.playgrounds.forEach(p=>{
    if(hav(lat,lng,p.lat,p.lng)<=radius){
      const m=L.marker([p.lat,p.lng],{icon:pi,opacity:0.65});
      m.on('click',()=>openDrawer(p,'playground'));pgCluster.addLayer(m);
    }
  });
}

// Swipe down to close drawer
let tsy=0;
document.addEventListener('touchstart',e=>{tsy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dy=e.changedTouches[0].clientY-tsy;
  const drw=document.getElementById('drawer');
  if(dy>80&&drw&&drw.classList.contains('open')&&drw.scrollTop===0)closeDrawer();
},{passive:true});

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
</script>
